; cmspeed settings. Copy this file next to cm0102.exe together with dsound.dll.
; README.md describes every option, and docs/ explains how each one works.
[cmspeed]

; ---- Holiday ----
; Milliseconds the game shows each holiday day before it continues. Stock is 2000,
; which is most of a holiday's time. 0 = continue as soon as the day is processed.
holiday_wait=0

; ---- Exact speed-ups: the same results as the stock game ----
; 1 = replace the game's float-to-int conversion with an SSE3 instruction that gives
; identical results without stalling the FPU. Holidays take about 15% less time. 0 = stock code.
fast_ftol=1
; 1 = when creating a new game, insert player history records in place instead of
; re-sorting the whole list after each one. Exactly the same result. 0 = stock code.
fast_hist=1
; 1 = load the next candidates' data early in the AI's shortlist scan. It only reads
; memory. 0 = stock code.
prefetch=1

; ---- Parallel processing: equivalent results, not identical ----
; Threads for splitting the AI's shortlist scan and for simulating background matches.
; auto = the CPU's logical processors, at most 8. Or set your own number, up to 16.
; 0 = off: everything on the game's own thread, as stock.
threads=auto

; ---- Convenience ----
; 1 = skip the startup logos. 0 = stock.
skip_splash=1
; 1 = the mouse's back/forward side buttons (and the keyboard's browser back/forward
; keys) go back and forward through screens, like the arrows in the sidebar. 0 = stock.
mouse_nav=1

; ---- Troubleshooting ----
; 1 = write cmspeed.log next to the exe: which patches were applied, and the address of
; any crash. Attach it to bug reports. 0 = no log.
log=0
